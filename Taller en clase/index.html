<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidad II · Formularios avanzados</title>
    <!-- Font Awesome 6 (gratuito) para iconos -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Estilos CSS personalizados -->
    <link rel="stylesheet" href="/css/login.css" />
  </head>
  <body>
    <!-- Formulario con validación personalizada desactivando la nativa -->
    <form id="login-form" novalidate>

      <h1>Iniciar sesión</h1>

      <div class="form-group">
        <label for="loginEmail">Correo Electrónico</label>
        <input
         type="email"
            id="loginEmail"
            name="email"
            required
            placeholder="correo@unicaribe.edu.co"
        />
        <span class="error-message" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="loginPass">Contraseña</label>
        <input
          type="password"
          id="loginPass"
          name="password"
          required
          minlength="7"
          placeholder="Ingrese su contraseña"
        />
        <span class="error-message" id="passwordError"></span>
      </div>

      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>

    <section id="loginWelcome" style="display: none">
      <h2>Bienvenido</h2>
      <p>Has iniciado sesión con <span id="userEmailDisplay"></span>.</p>
    </section>
  
  
  
  
  
  </body>

  <script src="/js/login.js"></script>

</html>
